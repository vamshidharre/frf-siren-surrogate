# Final configuration (SIREN, omega0 = 2, 3 residual blocks, ~103k parameters)

data_dir: data/processed
out_dir: runs/siren_w2

split:
  frac: [0.70, 0.15, 0.15]   # train / val / test, by design variant
  seed: 42

screening:
  top_k: 10
  n_bands: 12          # log-spaced bands used as screening targets
  use_shap: true       # needs `pip install shap`; skipped otherwise

encoding:
  n_bands: 8           # K octave bands -> 16 features
  scale: log           # normalise f to [0,1] on a log axis ("linear" also supported)

model:
  type: siren          # siren | gelu | silu | tanh | relu
  width: 128
  n_blocks: 3
  omega0: 2.0

train:
  seed: 42
  epochs: 300
  batch_size: 4096
  lr: 1.0e-3
  lr_min: 1.0e-5
  weight_decay: 1.0e-4
  input_noise: 0.0     # std of Gaussian jitter on standardised material inputs
  patience: 25
